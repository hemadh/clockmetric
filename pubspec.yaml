name: time_tracker
description: "ClockMetric employee time tracking application."
publish_to: "none"

version: 1.0.5+4

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.12.1
  app_links: ^7.2.1
  win32_registry: ^3.0.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  path_provider: ^2.1.5
  image: ^4.2.0
  url_launcher: ^6.3.2
  encrypter_plus: ^5.1.0
  process_run: ^1.3.4
  package_info_plus: ^10.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/clockmetric_logo.png
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256